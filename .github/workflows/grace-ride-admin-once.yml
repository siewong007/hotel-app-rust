name: grace-ride-admin-once

# Manual one-shot. Does not build or deploy the hotel app.
# Prints only an encrypted invite. The private key never leaves the operator machine.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-invite:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Read the Grace Ride admin invite
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_HOST: 162.19.81.122
          VPS_PORT: "20049"
          VPS_USER: root
          VPS_HOST_KEY: "[162.19.81.122]:20049 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIxenH95jfg3hxfkumJpZJyV7phwCNDrXrAL0wUXnta9"
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_PRIVATE_KEY"
          install -m 0600 /dev/null "$RUNNER_TEMP/vps-key"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/vps-key"
          install -m 0600 /dev/null "$RUNNER_TEMP/known_hosts"
          printf '%s\n' "$VPS_HOST_KEY" > "$RUNNER_TEMP/known_hosts"
          ssh-keygen -lf "$RUNNER_TEMP/known_hosts" | grep -Fq 'SHA256:HV6OszvuYmwmWRLEY7z7jm8GojWZJppJlDBHIhJVUxw'
          cat > "$RUNNER_TEMP/admin-pub.pem" <<'PUB'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAs8yOZ1q49Pac3H9fLJ4R
          FWWV1B22uVWgqIFxX5cgXiO4PTwAyMF5XJFQv891JfCTuIcBlNEHtLbGWQgjX/Md
          YMnoLknPPF1raG2kOVxooS9zJ7nIjg5lBG8tFQdzeBlMBjOBkdBuptv1Axspj/2t
          5hOBv1bkBUs/PvgaWktoQMtNzaCITQmSMZvI/A2xncFIGD8Xi2esCJdw/HCiculj
          3fxsboRAb/wIgEktXlf3HemAM5FMmXHg6/q+0kpYrURdum0GgKXTrJ35EFjrdkXc
          DiFrKmLRkmwXmZq3OYFpu3iYZuRCiyO6dw/jGXdkE8CmHx7Yv2dnhA5q8fRMkQl0
          2wIDAQAB
          -----END PUBLIC KEY-----
          PUB
          ssh -i "$RUNNER_TEMP/vps-key" -p "$VPS_PORT" \
            -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "$VPS_USER@$VPS_HOST" \
            'umask 077; cat > /tmp/gr-admin-read.sh && bash /tmp/gr-admin-read.sh; rc=$?; rm -f /tmp/gr-admin-read.sh; exit $rc' \
            > "$RUNNER_TEMP/admin-url.txt" <<'REMOTE'
          set -euo pipefail
          meta=$(docker exec -i grace-ride-db psql -U grace -d grace_ride -v ON_ERROR_STOP=1 -tA -F '|' <<'SQL'
          SELECT id, email, name,
                 CASE WHEN password_hash IS NULL OR password_hash = '' THEN 'no' ELSE 'yes' END,
                 (SELECT count(*) FROM passkeys p WHERE p.user_id = users.id)
          FROM users
          WHERE email = 'admin@pjstatecmc.org' OR position('admin' in roles) > 0
          ORDER BY (email = 'admin@pjstatecmc.org') DESC, id
          LIMIT 1
          SQL
          )
          meta=${meta//$'\r'/}
          IFS='|' read -r uid email name has_pw passkeys <<<"$meta"
          if [[ ! "${uid:-}" =~ ^[0-9]+$ || -z "${email:-}" ]]; then
            echo "admin account not found" >&2
            exit 1
          fi
          users=$(docker exec -i grace-ride-db psql -U grace -d grace_ride -v ON_ERROR_STOP=1 -tA -c 'SELECT COUNT(*) FROM users')
          echo "users=${users//$'\r'/}" >&2
          echo "admin_id=$uid" >&2
          echo "admin_email=$email" >&2
          echo "admin_name=$name" >&2
          echo "has_password=$has_pw" >&2
          echo "passkeys=$passkeys" >&2
          token=$(docker exec -i grace-ride-db psql -U grace -d grace_ride -v ON_ERROR_STOP=1 -tA <<SQL
          SELECT token FROM invites
          WHERE user_id = ${uid}
            AND kind = 'recovery'
            AND used_at IS NULL
            AND expires_at > to_char(NOW() AT TIME ZONE 'Asia/Kuala_Lumpur', 'YYYY-MM-DD"T"HH24:MI:SS')
          ORDER BY id DESC
          LIMIT 1
          SQL
          )
          token=${token//$'\r'/}
          token=${token//$'\n'/}
          if [[ -n "$token" ]]; then
            echo "invite_action=existing" >&2
          else
            token=$(openssl rand -hex 16)
            if [[ ${#token} -ne 32 ]]; then
              echo "could not mint invite" >&2
              exit 1
            fi
            docker exec -i grace-ride-db psql -U grace -d grace_ride -v ON_ERROR_STOP=1 -q -v token="$token" -v uid="$uid" -v email="$email" >/dev/null <<'SQL'
          INSERT INTO invites (token, kind, email, name, roles, group_ids, user_id, created_by, expires_at)
          VALUES (
            :'token',
            'recovery',
            :'email',
            '管理员',
            'admin',
            '[]',
            :uid,
            :uid,
            to_char(NOW() AT TIME ZONE 'Asia/Kuala_Lumpur' + interval '7 days', 'YYYY-MM-DD"T"HH24:MI:SS')
          );
          SQL
            echo "invite_action=renewed" >&2
          fi
          exp=$(docker exec -i grace-ride-db psql -U grace -d grace_ride -v ON_ERROR_STOP=1 -tA <<SQL
          SELECT expires_at FROM invites
          WHERE user_id = ${uid} AND kind = 'recovery' AND used_at IS NULL
          ORDER BY id DESC
          LIMIT 1
          SQL
          )
          exp=${exp//$'\r'/}
          exp=${exp//$'\n'/}
          echo "invite_expires=$exp" >&2
          url="https://graceride.saliminn.my/invite/${token}"
          install -m 0600 /dev/null /opt/grace-ride/setup-link.txt
          printf '%s\n' "$url" > /opt/grace-ride/setup-link.txt
          printf '%s' "$url"
          REMOTE
          if ! grep -q '^https://graceride.saliminn.my/invite/[A-Za-z0-9]\{32\}$' "$RUNNER_TEMP/admin-url.txt"; then
            echo "invite link was not produced" >&2
            wc -c "$RUNNER_TEMP/admin-url.txt" >&2
            exit 1
          fi
          echo "CIPHER_BEGIN"
          openssl pkeyutl -encrypt -pubin -inkey "$RUNNER_TEMP/admin-pub.pem" -in "$RUNNER_TEMP/admin-url.txt" | base64 -w0
          echo
          echo "CIPHER_END"
          rm -f "$RUNNER_TEMP/admin-url.txt" "$RUNNER_TEMP/vps-key" "$RUNNER_TEMP/admin-pub.pem"
