name: grace-ride-copy-key-once

# Manual one-shot. Copies the AIC deploy key into the private Grace Ride repo.
# Does not build or deploy the hotel app, and does not print the key.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Store the AIC key on Grace Ride
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.GRACE_GH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_PRIVATE_KEY"
          test -n "$GH_TOKEN"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" | gh secret set VPS_SSH_PRIVATE_KEY --repo siewong007/grace-ride --env production
          echo "Grace Ride production secret is set."
