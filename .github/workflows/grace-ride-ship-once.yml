name: grace-ride-ship-once

# Manual one-shot. Does not build or deploy the hotel app.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ship:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Load Grace Ride 20261109e
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.GRACE_GH_TOKEN }}
          VPS_HOST: 162.19.81.122
          VPS_PORT: "20049"
          VPS_USER: root
          VPS_HOST_KEY: "[162.19.81.122]:20049 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIxenH95jfg3hxfkumJpZJyV7phwCNDrXrAL0wUXnta9"
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_PRIVATE_KEY"
          test -n "$GH_TOKEN"
          install -m 0600 /dev/null "$RUNNER_TEMP/vps-key"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/vps-key"
          install -m 0600 /dev/null "$RUNNER_TEMP/known_hosts"
          printf '%s\n' "$VPS_HOST_KEY" > "$RUNNER_TEMP/known_hosts"
          ssh-keygen -lf "$RUNNER_TEMP/known_hosts" | grep -Fq 'SHA256:HV6OszvuYmwmWRLEY7z7jm8GojWZJppJlDBHIhJVUxw'
          gh release download 20261109e --repo siewong007/grace-ride-deploy --pattern 'grace-ride-20261109e.tar.gz' --dir "$RUNNER_TEMP"
          gzip -t "$RUNNER_TEMP/grace-ride-20261109e.tar.gz"
          SSH=(ssh -i "$RUNNER_TEMP/vps-key" -p "$VPS_PORT"
            -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts"
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10)
          scp -i "$RUNNER_TEMP/vps-key" -P "$VPS_PORT" \
            -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            "$RUNNER_TEMP/grace-ride-20261109e.tar.gz" "$VPS_USER@$VPS_HOST:/tmp/grace-ride-20261109e.tar.gz"
          "${SSH[@]}" "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "users_before=$(docker exec grace-ride-db psql -U grace -d grace_ride -tAc 'SELECT COUNT(*) FROM users')"
          echo "db_id=$(docker inspect -f '{{.Id}}' grace-ride-db)"
          echo "db_created=$(docker inspect -f '{{.Created}}' grace-ride-db)"
          gzip -t /tmp/grace-ride-20261109e.tar.gz
          gunzip -c /tmp/grace-ride-20261109e.tar.gz | docker load
          rm -f /tmp/grace-ride-20261109e.tar.gz
          grep -q '^IMAGE_TAG=' /opt/grace-ride/secrets.env
          sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=20261109e/' /opt/grace-ride/secrets.env
          grep -q '^IMAGE_TAG=20261109e$' /opt/grace-ride/secrets.env
          docker compose --env-file /opt/grace-ride/secrets.env -f /opt/grace-ride/docker-compose.aic.yml up -d --no-deps app
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8090/api/health; then
              echo
              echo "health_try=$i"
              ok=1
              break
            fi
            sleep 2
          done
          if [[ "$ok" != 1 ]]; then
            docker logs grace-ride 2>&1 | grep -v -e 'one-time' -e '/invite/' | tail -30 >&2 || true
            exit 1
          fi
          echo "users_after=$(docker exec grace-ride-db psql -U grace -d grace_ride -tAc 'SELECT COUNT(*) FROM users')"
          echo "db_id_after=$(docker inspect -f '{{.Id}}' grace-ride-db)"
          echo "db_created_after=$(docker inspect -f '{{.Created}}' grace-ride-db)"
          docker inspect grace-ride --format 'app_image={{.Config.Image}} app_id={{.Id}} status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{end}}'
          echo "admin_lines=$(docker logs grace-ride 2>&1 | grep -c 'First administrator' || true)"
          echo "panic_lines=$(docker logs grace-ride 2>&1 | grep -c panic || true)"
          echo "asset=$(curl -fsS http://127.0.0.1:8090/login | grep -o 'assets/index-[^\" ]*css' | head -1)"
          REMOTE
          rm -f "$RUNNER_TEMP/vps-key" "$RUNNER_TEMP/grace-ride-20261109e.tar.gz"
