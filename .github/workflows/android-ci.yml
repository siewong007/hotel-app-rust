name: Android — Unit Tests, Lint & Build

on:
  push:
    branches: [main, master]
    paths:
      - "hotel-android/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "hotel-android/**"
      - ".github/workflows/android-ci.yml"

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android — Test, Lint & Assemble
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hotel-android

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run unit tests, lint, and debug APK build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon --console=plain
