name: Deploy staging

# Staging deploy to the same AIC VPS as production, isolated under
# /opt/saliminn-staging. Mirrors the zero-incremental-cost SSH bundle path.
#
# Required secret (repo or "staging" environment):
#   VPS_SSH_PRIVATE_KEY - SSH private key for staging deployment.
#   SECURITY NOTE: Ideally provision a dedicated non-root staging user/host so
#   staging does not share root SSH access with production. Until separated,
#   workflow_dispatch strictly restricts candidate SHAs to CI-verified ancestors
#   of refs/heads/master.
#
# Host key pin (same as production):
#   SHA256:HV6OszvuYmwmWRLEY7z7jm8GojWZJppJlDBHIhJVUxw

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      sha:
        description: "Full 40-char commit SHA to deploy (leave empty for current master HEAD)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: saliminn-staging
  cancel-in-progress: false

env:
  VPS_HOST: 162.19.81.122
  VPS_PORT: "20049"
  VPS_USER: root
  VPS_HOST_KEY: "[162.19.81.122]:20049 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIxenH95jfg3hxfkumJpZJyV7phwCNDrXrAL0wUXnta9"
  # Flip to true after staging.saliminn.my DNS/Cloudflare points at this origin.
  PUBLIC_DNS_CUTOVER: "true"

jobs:
  gate:
    name: Select staging revision
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'master' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.select.outputs.deploy }}
      sha: ${{ steps.select.outputs.sha }}

    steps:
      - name: Choose SHA
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ inputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          latest_sha=$(git ls-remote --exit-code \
            "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/master | awk '{print $1}')
          [[ "$latest_sha" =~ ^[0-9a-f]{40}$ ]]

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            target_sha="${DISPATCH_SHA:-$latest_sha}"
            [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]]

            # Prevent arbitrary-branch/fork code execution on the shared VPS:
            # require the dispatched SHA to be an ancestor of refs/heads/master
            # and to have a completed successful CI workflow run.
            if [[ "$target_sha" != "$latest_sha" ]]; then
              compare_status=$(gh api "repos/$GITHUB_REPOSITORY/compare/${target_sha}...${latest_sha}" --jq '.status')
              if [[ "$compare_status" != "ahead" && "$compare_status" != "identical" ]]; then
                echo "Refusing workflow_dispatch SHA $target_sha: not an ancestor of refs/heads/master (compare status: $compare_status)." >&2
                exit 1
              fi
            fi

            ci_success_count=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=${target_sha}&status=completed&per_page=20" \
              --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')
            if [[ "${ci_success_count:-0}" -lt 1 ]]; then
              echo "Refusing workflow_dispatch SHA $target_sha: no successful CI workflow run found for this commit." >&2
              exit 1
            fi

            printf 'sha=%s\n' "$target_sha" >> "$GITHUB_OUTPUT"
            printf 'deploy=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          if [[ "$CANDIDATE_SHA" == "$latest_sha" ]]; then
            printf 'deploy=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'deploy=false\n' >> "$GITHUB_OUTPUT"
            echo "Skipping superseded commit $CANDIDATE_SHA; master is $latest_sha."
          fi

  deploy:
    name: Build and deploy staging to the AIC VPS
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: staging
    env:
      DEPLOY_SHA: ${{ needs.gate.outputs.sha }}
      # Google sign-in client id, inlined into the frontend bundle at build
      # time. Public by design (it ships in the JS either way), so a repository
      # variable is the natural home; a secret of the same name also works and
      # takes over when no variable is set. Empty when neither exists, which
      # leaves the Google button hidden rather than breaking the build. Must
      # match GOOGLE_CLIENT_ID in the backend's secrets.env on the host.
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID || secrets.GOOGLE_CLIENT_ID }}
      # Public half of the Cloudflare Turnstile pair, inlined into the bundle
      # at build time. A repository variable is the natural home. Empty leaves
      # the auth pages unchallenged rather than breaking the build. Must match
      # TURNSTILE_SITE_KEY in the backend's secrets.env on the host -- and note
      # the SECRET key is deliberately absent here: it belongs only to the
      # host's secrets.env, never to a frontend build argument.
      # Staging takes its own key when one is set, so the challenge can be
      # exercised on staging.saliminn.my without arming production: the
      # production workflow reads TURNSTILE_SITE_KEY only, which stays unset
      # until staging has proved the widget actually works in a real browser.
      TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY_STAGING || vars.TURNSTILE_SITE_KEY || secrets.TURNSTILE_SITE_KEY }}

    steps:
      - name: Check out the selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false

      - name: Verify deployment revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"

      - name: Build linux/amd64 application images
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --platform linux/amd64 \
            --pull \
            --label "org.opencontainers.image.revision=$DEPLOY_SHA" \
            --tag "saliminn-backend:$DEPLOY_SHA" \
            hotel-app-be
          docker build \
            --platform linux/amd64 \
            --pull \
            --build-arg VITE_API_URL= \
            --build-arg VITE_GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" \
            --build-arg VITE_TURNSTILE_SITE_KEY="$TURNSTILE_SITE_KEY" \
            --label "org.opencontainers.image.revision=$DEPLOY_SHA" \
            --tag "saliminn-frontend:$DEPLOY_SHA" \
            hotel-web-fe

          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' \
            "saliminn-backend:$DEPLOY_SHA")" = "linux/amd64"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' \
            "saliminn-frontend:$DEPLOY_SHA")" = "linux/amd64"

      - name: Create checksummed staging release bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="$RUNNER_TEMP/saliminn-staging-release"
          bundle_path="$RUNNER_TEMP/saliminn-staging-$DEPLOY_SHA.tar.gz"
          mkdir -p "$bundle_dir/images" "$bundle_dir/initdb" "$bundle_dir/database/patches"

          docker save "saliminn-backend:$DEPLOY_SHA" | gzip -1 > "$bundle_dir/images/backend.tar.gz"
          docker save "saliminn-frontend:$DEPLOY_SHA" | gzip -1 > "$bundle_dir/images/frontend.tar.gz"

          # Staging uses the production Compose file. deploy-staging.sh exports
          # the ports, names, and paths that keep it off the production stack.
          cp deploy/deploy-staging.sh "$bundle_dir/deploy.sh"
          cp deploy/database-backup-staging.sh "$bundle_dir/database-backup.sh"
          cp deploy/check-backup-health.sh "$bundle_dir/check-backup-health.sh"
          cp deploy/docker-compose.prod.yml "$bundle_dir/docker-compose.prod.yml"

          cp hotel-app-be/database/postgres/migrations/0001_v1_baseline.sql \
            "$bundle_dir/initdb/01-v1-baseline.sql"
          cp hotel-app-be/database/postgres/seed.sql "$bundle_dir/initdb/02-seed.sql"
          cp hotel-app-be/database/postgres/apply-patches.sh \
            "$bundle_dir/database/apply-patches.sh"
          cp hotel-app-be/database/postgres/patches/manifest.tsv \
            "$bundle_dir/database/patches/manifest.tsv"
          cp hotel-app-be/database/postgres/patches/_begin.sql \
            "$bundle_dir/database/patches/_begin.sql"
          cp hotel-app-be/database/postgres/patches/_end.sql \
            "$bundle_dir/database/patches/_end.sql"
          cp hotel-app-be/database/postgres/patches/0002_deposit_forfeited.sql \
            "$bundle_dir/database/patches/0002_deposit_forfeited.sql"
          cp hotel-app-be/database/postgres/patches/0003_guest_relations_phase2.sql \
            "$bundle_dir/database/patches/0003_guest_relations_phase2.sql"
          cp hotel-app-be/database/postgres/patches/0004_consent_locale_zh.sql \
            "$bundle_dir/database/patches/0004_consent_locale_zh.sql"
          cp hotel-app-be/database/postgres/patches/0005_data_transfer_permissions.sql \
            "$bundle_dir/database/patches/0005_data_transfer_permissions.sql"
          cp hotel-app-be/database/postgres/patches/0006_channel_pricing.sql \
            "$bundle_dir/database/patches/0006_channel_pricing.sql"
          cp hotel-app-be/database/postgres/patches/0007_consent_locale_zh_tw.sql \
            "$bundle_dir/database/patches/0007_consent_locale_zh_tw.sql"
          cp hotel-app-be/database/postgres/patches/0008_distributed_state.sql \
            "$bundle_dir/database/patches/0008_distributed_state.sql"
          cp hotel-app-be/database/postgres/patches/0009_booking_smoking_preference.sql \
            "$bundle_dir/database/patches/0009_booking_smoking_preference.sql"
          cp hotel-app-be/database/postgres/patches/0010_online_inventory_manage_permission.sql \
            "$bundle_dir/database/patches/0010_online_inventory_manage_permission.sql"
          cp hotel-app-be/database/postgres/patches/0011_default_locale.sql \
            "$bundle_dir/database/patches/0011_default_locale.sql"
          cp hotel-app-be/database/postgres/patches/0012_new_reservation_visible_time.sql \
            "$bundle_dir/database/patches/0012_new_reservation_visible_time.sql"
          cp hotel-app-be/database/postgres/patches/0013_staff_notifications.sql \
            "$bundle_dir/database/patches/0013_staff_notifications.sql"
          cp hotel-app-be/database/postgres/patches/0014_new_reservation_visible_time_default.sql \
            "$bundle_dir/database/patches/0014_new_reservation_visible_time_default.sql"
          cp hotel-app-be/database/postgres/patches/0015_drop_hotel_property_graph.sql \
            "$bundle_dir/database/patches/0015_drop_hotel_property_graph.sql"
          cp hotel-app-be/database/postgres/patches/0016_audit_partition_without_split.sql \
            "$bundle_dir/database/patches/0016_audit_partition_without_split.sql"
          cp hotel-app-be/database/postgres/patches/0017_session_retention.sql \
            "$bundle_dir/database/patches/0017_session_retention.sql"
          cp hotel-app-be/database/postgres/patches/0018_room_hold_arrival_day.sql \
            "$bundle_dir/database/patches/0018_room_hold_arrival_day.sql"
          cp hotel-app-be/database/postgres/patches/0019_payment_void_reason.sql \
            "$bundle_dir/database/patches/0019_payment_void_reason.sql"
          cp hotel-app-be/database/postgres/patches/0020_reception_payment_void.sql \
            "$bundle_dir/database/patches/0020_reception_payment_void.sql"
          cp hotel-app-be/database/postgres/patches/0021_audit_partition_move_rows.sql \
            "$bundle_dir/database/patches/0021_audit_partition_move_rows.sql"
          cp hotel-app-be/database/postgres/patches/0022_audit_logs_append_only_guards.sql \
            "$bundle_dir/database/patches/0022_audit_logs_append_only_guards.sql"
          cp hotel-app-be/database/postgres/patches/0023_channel_settlement_methods.sql \
            "$bundle_dir/database/patches/0023_channel_settlement_methods.sql"
          cp hotel-app-be/database/postgres/patches/0024_runtime_capabilities.sql \
            "$bundle_dir/database/patches/0024_runtime_capabilities.sql"
          cp hotel-app-be/database/postgres/patches/0026_booking_group_totals_backfill.sql \
            "$bundle_dir/database/patches/0026_booking_group_totals_backfill.sql"
          cp hotel-app-be/database/postgres/patches/0027_booking_group_voucher_share.sql \
            "$bundle_dir/database/patches/0027_booking_group_voucher_share.sql"
          cp hotel-app-be/database/postgres/patches/0028_job_runs.sql \
            "$bundle_dir/database/patches/0028_job_runs.sql"
          cp hotel-app-be/database/postgres/patches/0029_voucher_allocation_per_room_night.sql \
            "$bundle_dir/database/patches/0029_voucher_allocation_per_room_night.sql"
          cp hotel-app-be/database/postgres/patches/0030_hotel_currency_defaults.sql \
            "$bundle_dir/database/patches/0030_hotel_currency_defaults.sql"
          cp hotel-app-be/database/postgres/patches/0031_manager_owns_user_management.sql \
            "$bundle_dir/database/patches/0031_manager_owns_user_management.sql"
          cp hotel-app-be/database/postgres/patches/0032_full_audit_schema_fixes.sql \
            "$bundle_dir/database/patches/0032_full_audit_schema_fixes.sql"
          cp hotel-app-be/database/postgres/patches/0033_security_audit_hardening.sql \
            "$bundle_dir/database/patches/0033_security_audit_hardening.sql"
          cp hotel-app-be/database/postgres/patches/0034_db_perf_integrity_hardening.sql \
            "$bundle_dir/database/patches/0034_db_perf_integrity_hardening.sql"
          cp hotel-app-be/database/postgres/patches/0035_bughunter_security_fixes.sql \
            "$bundle_dir/database/patches/0035_bughunter_security_fixes.sql"
          cp hotel-app-be/database/postgres/patches/0036_wave2_security_hardening.sql \
            "$bundle_dir/database/patches/0036_wave2_security_hardening.sql"
          cp hotel-app-be/database/postgres/patches/0025_booking_groups.sql \
            "$bundle_dir/database/patches/0025_booking_groups.sql"
          cp deploy/db-least-privilege.sql "$bundle_dir/database/db-least-privilege.sql"
          (
            cd "$bundle_dir"
            sha256sum \
              deploy.sh \
              database-backup.sh \
              check-backup-health.sh \
              docker-compose.prod.yml \
              images/backend.tar.gz \
              images/frontend.tar.gz \
              initdb/01-v1-baseline.sql \
              initdb/02-seed.sql \
              database/apply-patches.sh \
              database/patches/manifest.tsv \
              database/patches/_begin.sql \
              database/patches/_end.sql \
              database/patches/0002_deposit_forfeited.sql \
              database/patches/0003_guest_relations_phase2.sql \
              database/patches/0004_consent_locale_zh.sql \
              database/patches/0005_data_transfer_permissions.sql \
              database/patches/0006_channel_pricing.sql \
              database/patches/0007_consent_locale_zh_tw.sql \
              database/patches/0008_distributed_state.sql \
              database/patches/0009_booking_smoking_preference.sql \
              database/patches/0010_online_inventory_manage_permission.sql \
              database/patches/0011_default_locale.sql \
              database/patches/0012_new_reservation_visible_time.sql \
              database/patches/0013_staff_notifications.sql \
              database/patches/0014_new_reservation_visible_time_default.sql \
              database/patches/0015_drop_hotel_property_graph.sql \
              database/patches/0016_audit_partition_without_split.sql \
              database/patches/0017_session_retention.sql \
              database/patches/0018_room_hold_arrival_day.sql \
              database/patches/0019_payment_void_reason.sql \
              database/patches/0020_reception_payment_void.sql \
              database/patches/0021_audit_partition_move_rows.sql \
              database/patches/0022_audit_logs_append_only_guards.sql \
              database/patches/0023_channel_settlement_methods.sql \
              database/patches/0024_runtime_capabilities.sql \
              database/patches/0025_booking_groups.sql \
              database/patches/0026_booking_group_totals_backfill.sql \
              database/patches/0027_booking_group_voucher_share.sql \
              database/patches/0028_job_runs.sql \
              database/patches/0029_voucher_allocation_per_room_night.sql \
              database/patches/0030_hotel_currency_defaults.sql \
              database/patches/0031_manager_owns_user_management.sql \
              database/patches/0032_full_audit_schema_fixes.sql \
              database/patches/0033_security_audit_hardening.sql \
              database/patches/0034_db_perf_integrity_hardening.sql \
              database/patches/0035_bughunter_security_fixes.sql \
              database/patches/0036_wave2_security_hardening.sql \
              database/db-least-privilege.sql \
              > SHA256SUMS
          )
          tar -C "$bundle_dir" -czf "$bundle_path" .
          ls -lh "$bundle_path"

      - name: Configure pinned SSH access
        shell: bash
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_PRIVATE_KEY"
          install -m 0600 /dev/null "$RUNNER_TEMP/vps-key"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/vps-key"
          install -m 0600 /dev/null "$RUNNER_TEMP/vps-known-hosts"
          printf '%s\n' "$VPS_HOST_KEY" > "$RUNNER_TEMP/vps-known-hosts"
          ssh-keygen -lf "$RUNNER_TEMP/vps-known-hosts" \
            | grep -Fq 'SHA256:HV6OszvuYmwmWRLEY7z7jm8GojWZJppJlDBHIhJVUxw'

      - name: Verify protected VPS disk capacity
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/saliminn-staging-$DEPLOY_SHA.tar.gz"
          archive_bytes=$(wc -c < "$archive" | tr -d ' ')
          [[ "$archive_bytes" =~ ^[0-9]+$ ]]
          required_bytes=$((6442450944 + (archive_bytes * 2)))
          ssh \
            -i "$RUNNER_TEMP/vps-key" \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/vps-known-hosts" \
            "$VPS_USER@$VPS_HOST" \
            "set -eu
             docker image prune -f >/dev/null 2>&1 || true
             # Failed deploys leave per-SHA image tags behind; deploy.sh's
             # cleanup_old_images only runs after a *successful* release, so
             # they accumulate until this check fails. Protect active/rollback
             # tags across both production and staging plus recently loaded images.
             protected_tags='$DEPLOY_SHA'
             for tag_file in /opt/saliminn/current-tag /opt/saliminn-staging/current-tag; do
               if [ -r \"\$tag_file\" ]; then
                 protected_tags=\"\$protected_tags \$(tr -d '[:space:]' < \"\$tag_file\")\"
               fi
             done
             for rel_dir in /opt/saliminn/releases /opt/saliminn-staging/releases; do
               if [ -d \"\$rel_dir\" ]; then
                 for recent in \$(ls -1t \"\$rel_dir\" 2>/dev/null | head -n 4 || true); do
                   protected_tags=\"\$protected_tags \${recent%.incoming}\"
                 done
               fi
             done
             now_epoch=\$(date -u +%s)
             for release_image in \$(docker image ls --format '{{.Repository}}:{{.Tag}}' | grep -E ':[0-9a-f]{40}\$' || true); do
               image_tag=\${release_image##*:}
               case \" \$protected_tags \" in
                 *\" \$image_tag \"*) continue ;;
               esac
               created_at=\$(docker image inspect --format '{{.Created}}' \"\$release_image\" 2>/dev/null || true)
               created_epoch=\$(date -u -d \"\$created_at\" +%s 2>/dev/null || echo 0)
               if [ \"\$created_epoch\" -gt 0 ] && [ \$((now_epoch - created_epoch)) -lt 3600 ]; then
                 continue
               fi
               docker image rm \"\$release_image\" >/dev/null 2>&1 || true
             done
             find /opt/saliminn-staging/incoming -maxdepth 1 -name 'saliminn-staging-*.tar.gz*' -mmin +60 -delete 2>/dev/null || true
             failed=0
             for target in /tmp /opt; do
               available=\$(df --output=avail -B1 \"\$target\" | tail -n 1 | tr -d ' ')
               if [ \"\$available\" -lt $required_bytes ]; then
                 echo \"Insufficient free space on \$target for a protected deployment\" >&2
                 failed=1
               fi
             done
             if [ \"\$failed\" -ne 0 ]; then
               df -h /tmp /opt >&2 || true
               du -xh --max-depth=2 /opt/saliminn-staging /opt/saliminn /tmp 2>/dev/null | sort -rh | head -n 20 >&2 || true
               exit 1
             fi"

      - name: Upload staging release to private VPS staging directory
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/saliminn-staging-$DEPLOY_SHA.tar.gz"
          bundle_sha256=$(sha256sum "$archive" | awk '{print $1}')
          echo "BUNDLE_SHA256=$bundle_sha256" >> "$GITHUB_ENV"
          ssh \
            -i "$RUNNER_TEMP/vps-key" \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/vps-known-hosts" \
            "$VPS_USER@$VPS_HOST" \
            "set -euo pipefail
             umask 077
             sudo install -d -m 0700 -o root -g root /opt/saliminn-staging/incoming
             sudo sh -c 'cat > /opt/saliminn-staging/incoming/saliminn-staging-$DEPLOY_SHA.tar.gz.part'
             sudo chmod 0600 /opt/saliminn-staging/incoming/saliminn-staging-$DEPLOY_SHA.tar.gz.part" < "$archive"

      - name: Deploy staging and wait for health checks
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # For push-triggered runs, refuse stale master. For workflow_dispatch,
          # re-verify the dispatched SHA is still an ancestor of master.
          latest_sha=$(git ls-remote --exit-code \
            "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/master | awk '{print $1}')
          [[ "$latest_sha" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
            if [[ "$DEPLOY_SHA" != "$latest_sha" ]]; then
              echo "Refusing stale staging deployment $DEPLOY_SHA; master is now $latest_sha." >&2
              exit 1
            fi
          elif [[ "$DEPLOY_SHA" != "$latest_sha" ]]; then
            compare_status=$(gh api "repos/$GITHUB_REPOSITORY/compare/${DEPLOY_SHA}...${latest_sha}" --jq '.status')
            if [[ "$compare_status" != "ahead" && "$compare_status" != "identical" ]]; then
              echo "Refusing workflow_dispatch SHA $DEPLOY_SHA: no longer an ancestor of master." >&2
              exit 1
            fi
          fi

          ssh \
            -i "$RUNNER_TEMP/vps-key" \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/vps-known-hosts" \
            "$VPS_USER@$VPS_HOST" \
            "set -euo pipefail
             trap 'sudo rm -f /opt/saliminn-staging/incoming/saliminn-staging-$DEPLOY_SHA.tar.gz.part /opt/saliminn-staging/incoming/saliminn-staging-$DEPLOY_SHA.tar.gz' EXIT
             sudo mv /opt/saliminn-staging/incoming/saliminn-staging-$DEPLOY_SHA.tar.gz.part /opt/saliminn-staging/incoming/saliminn-staging-$DEPLOY_SHA.tar.gz
             echo \"$BUNDLE_SHA256  /opt/saliminn-staging/incoming/saliminn-staging-$DEPLOY_SHA.tar.gz\" | sudo sha256sum --check -
             sudo rm -rf -- /opt/saliminn-staging/releases/$DEPLOY_SHA.incoming
             sudo install -d -m 0750 /opt/saliminn-staging/releases/$DEPLOY_SHA.incoming
             sudo tar -xzf /opt/saliminn-staging/incoming/saliminn-staging-$DEPLOY_SHA.tar.gz -C /opt/saliminn-staging/releases/$DEPLOY_SHA.incoming
             sudo rm -rf -- /opt/saliminn-staging/releases/$DEPLOY_SHA
             sudo mv /opt/saliminn-staging/releases/$DEPLOY_SHA.incoming /opt/saliminn-staging/releases/$DEPLOY_SHA
             sudo /bin/bash /opt/saliminn-staging/releases/$DEPLOY_SHA/deploy.sh \
               $DEPLOY_SHA /opt/saliminn-staging/releases/$DEPLOY_SHA"

      - name: Verify public HTTPS once staging DNS is cut over
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PUBLIC_DNS_CUTOVER" != "true" ]]; then
            echo "PUBLIC_DNS_CUTOVER is not true; localhost health checks passed and public HTTPS was skipped."
            exit 0
          fi
          edge_args=()
          if [[ -n "${STAGING_EDGE_SECRET:-}" ]]; then
            edge_args=(-H "X-Staging-Access: $STAGING_EDGE_SECRET")
          fi
          unauth_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "${edge_args[@]}" --max-time 20 https://staging.saliminn.my/ || true)
          if [[ "$unauth_status" != "401" && "$unauth_status" != "403" ]]; then
            echo "Expected unauthenticated staging UI probe to fail closed (401/403), got $unauth_status" >&2
            exit 1
          fi
          auth_args=()
          if [[ -n "${STAGING_BASIC_AUTH:-}" ]]; then
            auth_args=(-u "$STAGING_BASIC_AUTH")
          fi
          curl --fail --silent --show-error \
            "${edge_args[@]}" \
            "${auth_args[@]}" \
            --retry 20 --retry-delay 5 --retry-all-errors \
            --max-time 20 \
            https://staging.saliminn.my/health >/dev/null
          echo "Public HTTPS staging health check passed."
        env:
          STAGING_BASIC_AUTH: ${{ secrets.STAGING_BASIC_AUTH }}
          STAGING_EDGE_SECRET: ${{ secrets.STAGING_EDGE_SECRET }}

      - name: Remove remote transfer files
        if: always()
        shell: bash
        run: |
          if [[ -s "$RUNNER_TEMP/vps-key" && -s "$RUNNER_TEMP/vps-known-hosts" ]]; then
            ssh \
              -i "$RUNNER_TEMP/vps-key" \
              -p "$VPS_PORT" \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o "UserKnownHostsFile=$RUNNER_TEMP/vps-known-hosts" \
              "$VPS_USER@$VPS_HOST" \
              "sudo rm -f -- /opt/saliminn-staging/incoming/saliminn-staging-$DEPLOY_SHA.tar.gz.part /opt/saliminn-staging/incoming/saliminn-staging-$DEPLOY_SHA.tar.gz /tmp/saliminn-staging-$DEPLOY_SHA.tar.gz.part /tmp/saliminn-staging-$DEPLOY_SHA.tar.gz" \
              || true
          fi

      - name: Remove ephemeral SSH key
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/vps-key" "$RUNNER_TEMP/vps-known-hosts"
